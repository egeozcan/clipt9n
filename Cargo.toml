[package]
name = "clipt9n"
version = "0.0.1"
edition = "2021"
rust-version = "1.83"
description = "Clipboard translation utility — global hotkey, LLM-backed"
license = "MIT"

[lib]
name = "clipt9n"
path = "src/lib.rs"

[[bin]]
name = "clipt9n"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
arboard = "3.4"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
minijinja = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
whatlang = "0.16"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
directories = "5"
keyring = "3"
async-trait = "0.1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "x11", "wayland"] }
egui = "0.31"
global-hotkey = "0.7"
tray-icon = { version = "0.22", default-features = false }
notify-rust = "4"
crossbeam-channel = "0.5"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
egui_kittest = "0.31"

[features]
internal-test-helpers = []

[package.metadata.bundle]
name = "clipt9n"
identifier = "dev.egecan.clipt9n"
version = "0.1.0"
category = "public.app-category.utilities"
short_description = "Keyboard-driven clipboard translator"
long_description = "clipt9n is a menu-bar clipboard translator with hotkeys, glossary support, encrypted history, and setup wizard."
icon = ["assets/icon-32.png", "assets/icon-128.png", "assets/icon-256.png"]
osx_minimum_system_version = "13.0"
linux_use_terminal = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
